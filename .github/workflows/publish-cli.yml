name: Publish CLI

# Publish the `cheaperapp` CLI to npm on a version tag.
#   git tag v0.1.0 && git push origin v0.1.0
# Desktop installers live in the cheaper-desktop repo's own Release workflow.
#
# Secrets: NPM_TOKEN (npm automation token).
#
# Until this `test` job was added, this workflow's only job was `publish-npm`: it
# verified the tag matched cli/package.json's version, then ran `npm publish` — no test
# of any kind, on any runtime, ever ran first. A broken build published to the world
# unchallenged. `test:` below is the SAME job definition ci.yml runs on every ordinary
# push/PR (via `workflow_call`), so a release is gated on exactly the same bar as every
# other commit, not a weaker or different one. `publish-npm.needs: test` means the
# publish step (and its NPM_TOKEN) is never even reached if the suite fails.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run test suite before publishing
    uses: ./.github/workflows/ci.yml

  publish-npm:
    name: Publish cheaperapp to npm
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      HAS_NPM: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: A release tag with no NPM_TOKEN is a FAILED release, not a skipped step
        # Every step below is gated on env.HAS_NPM, which is false when the NPM_TOKEN
        # secret is absent or empty. GitHub records a skipped step as neither success nor
        # failure, so the JOB still reported "Publish cheaperapp to npm: success" — a
        # green tick, on a release tag, having published nothing at all.
        #
        # That is what happened on v0.4.1 (run 31359357043): the whole test suite passed,
        # the publish job went green, and npm stayed on 0.4.0. The only way to notice was
        # to query the registry afterwards and disbelieve the tick.
        #
        # This job only runs on a tag (see the job-level `if`), and a tag means "publish
        # this version". If we cannot, that is a failure — the gate exists so that
        # `… && announce-release` cannot fire on a release that never left the building.
        if: env.HAS_NPM != 'true'
        run: |
          echo "::error::NPM_TOKEN is not configured for this repository, so ${GITHUB_REF_NAME} was NOT published to npm. Every publish step was skipped and this job would otherwise have reported success."
          echo "Add an npm automation token as the NPM_TOKEN repository secret, then re-push the tag:"
          echo "  git push origin :refs/tags/${GITHUB_REF_NAME} && git push origin ${GITHUB_REF_NAME}"
          exit 1
      - uses: actions/setup-node@v4
        if: env.HAS_NPM == 'true'
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
      - name: Verify tag matches package version
        if: env.HAS_NPM == 'true'
        working-directory: cli
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag '$TAG' != cli/package.json version '$PKG'"; exit 1
          fi
      - name: Publish
        if: env.HAS_NPM == 'true'
        working-directory: cli
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
