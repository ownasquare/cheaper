name: CI

# The full test suite — JS<->Python parity gates, the CLI's own node --test suite, the
# gateway's pytest suite, and the Playwright E2E suite — in one place, so it can run both
# on every ordinary push/PR (see `on:` below) AND be gated on before a release publishes.
#
# Before this workflow existed, the ONLY workflow in this repo (publish-cli.yml) ran
# on a `vX.Y.Z` tag push and did exactly two things: verify the tag matched
# cli/package.json's version, then `npm publish`. It never ran ANY of this. A broken
# build published to npm unchallenged, and nothing ran on ordinary commits at all — the
# first signal of a regression was a bug report against a shipped release.
#
# `workflow_call` lets publish-cli.yml invoke this exact job definition and `needs:` it,
# so there is one source of truth for what "the suite passed" means, not two workflows
# that can drift apart.
#
# NOTE ON THE PYTEST STEP: at the time this workflow was ADDED, cli/assets/gateway/tests/
# test_reporting.py had 27 pre-existing failures (a raw-vs-rendered suppression mismatch)
# that a concurrent workstream was fixing — they had landed in the working tree by the
# time this workflow was verified (pytest ran 296 passed, 0 failed on that pass), but the
# policy that made that verification meaningful is the point to preserve: this workflow
# runs the FULL suite honestly — no `|| true`, no `continue-on-error`, no `-k`/
# `--deselect` filter to paper over a failure, here or in any other step. If any of these
# steps is red, that is real and this job MUST stay red until the cause is fixed — never
# loosen a step to turn this job green.

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test suite (parity gates, cli, gateway, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cli/assets/gateway/requirements.txt

      # Root devDependencies: @playwright/test, @axe-core/playwright, axe-core — the E2E
      # runner. cli/ itself ships with an intentionally empty dependency tree (see
      # cli/package.json's `files` comment and description), so nothing to install there.
      - name: Install JS dependencies
        run: npm ci

      - name: Install gateway (Python) dependencies
        run: pip install -r cli/assets/gateway/requirements.txt

      # Chromium only: it is the only browserName any project in playwright.config.js
      # uses, including the WebKit-shaped "tablet"/"mobile" projects, which deliberately
      # run Chromium's device emulation instead (see the comment on those projects).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # cli/package.json's own "test" script already chains sync-prices --check,
      # check-period-parity --check and `node --test test/` — but the two parity gates
      # are run again explicitly below, by name, so a future edit to that script cannot
      # silently drop one of them without this workflow's own step list still catching
      # it, and so a failure names the exact gate in the Actions UI instead of "npm test
      # failed, see log".
      - name: CLI test suite (node --test + parity gates + --help smoke)
        working-directory: cli
        run: npm test

      - name: JS<->Python price-catalog parity gate
        working-directory: cli
        run: node scripts/sync-prices.js --check

      - name: JS<->Python period-bucketing parity gate
        working-directory: cli
        run: node scripts/check-period-parity.js --check

      - name: Gateway pytest suite
        run: python3 -m pytest cli/assets/gateway/tests -q

      - name: Playwright E2E suite
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: .playwright-report/
          retention-days: 14
