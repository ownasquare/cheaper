<!doctype html>
<html><head><meta charset="utf-8"><title>Cheaper</title>
<style>
:root{--bg:#0b0b0d;--card:#141417;--fg:#ececf0;--mut:#8a8a94;--amber:#ff8a34;--line:#26262c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);
font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;padding:18px}
h1{font-size:16px;margin:0 0 2px}.sub{color:var(--mut);font-size:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.v{font-size:22px;font-weight:650;margin-top:4px}.amber{color:var(--amber)}
.row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--line)}
.pill{padding:1px 7px;border-radius:999px;font-size:11px}
.haiku{background:#0e3b2e;color:#5eead4}.sonnet{background:#0e2a4d;color:#7cc0ff}.opus{background:#3b1020;color:#ff9db0}
.off{color:var(--mut);text-align:center;margin-top:40px}
</style></head>
<body>
<h1>Cheaper <span class="amber">monitor</span></h1>
<div class="sub">Live routing decisions through the gateway.</div>
<div id="app"><div class="off">Connecting to the gateway…</div></div>
<script>
const PORT = 8787;
async function tick(){
  try{
    const m = await (await fetch(`http://localhost:${PORT}/metrics`)).json();
    const t = m.by_tier||{}; const n=k=>(t[k]&&t[k].count)||0;
    document.getElementById('app').innerHTML = `
      <div class="grid">
        <div class="card"><div class="k">Total routed</div><div class="v">${m.total}</div></div>
        <div class="card"><div class="k">Downgrade rate</div><div class="v amber">${m.downgrade_rate}%</div></div>
        <div class="card"><div class="k">Est. savings</div><div class="v amber">${m.est_savings_pct}%</div></div>
        <div class="card"><div class="k">H / S / O</div><div class="v">${n('haiku')} / ${n('sonnet')} / ${n('opus')}</div></div>
      </div>
      <div class="card"><div class="k" style="margin-bottom:6px">Recent</div>
        ${(m.recent||[]).slice(0,8).map(r=>`<div class="row">
          <span class="pill ${r.tier}">${r.tier}</span>
          <span style="color:var(--mut);flex:1;margin:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.reason||''}</span>
          <span style="color:var(--mut)">${new Date(r.ts*1000).toLocaleTimeString()}</span>
        </div>`).join('')||'<div class="off">No traffic yet.</div>'}
      </div>`;
  }catch(e){
    document.getElementById('app').innerHTML =
      '<div class="off">Gateway not running.<br>Start it from the menu bar.</div>';
  }
}
tick(); setInterval(tick, 3000);
</script>
</body></html>
